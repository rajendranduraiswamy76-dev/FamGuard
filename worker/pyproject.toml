[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "famguard-worker"
version = "0.1.0"
description = "FamGuard AI - Celery worker and Beat scheduler"
requires-python = ">=3.11,<3.12"
# famguard-api is installed from ../backend-api first (see README in IMPLEMENTATION_PLAN.md).
dependencies = [
  "famguard-api",
  "celery[redis]>=5.4",
  "resend>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "fakeredis>=2.26",
  "freezegun>=1.5",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["famguard_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a real Postgres (set TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["famguard_worker"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "famguard_worker"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["famguard_worker"]
# Celery's task/signal decorators are untyped.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "resend", "resend.*", "pypdfium2",
          "pypdfium2.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
